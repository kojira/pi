packages:
  - 'packages/*'
  - 'packages/session-backends/*'
  - 'packages/coding-agent/examples/extensions/with-deps'
  - 'packages/coding-agent/examples/extensions/custom-provider-anthropic'
  - 'packages/coding-agent/examples/extensions/custom-provider-gitlab-duo'
  - 'packages/coding-agent/examples/extensions/sandbox'
  - 'packages/coding-agent/examples/extensions/gondolin'

linkWorkspacePackages: true
preferWorkspacePackages: true

overrides:
  shell-quote: 1.12.0
  '@modelcontextprotocol/sdk': 1.32.0
  'zod@>=4.0.0 <4.6.6': 4.6.6
  body-parser: 2.4.0
  vite: 8.2.4
  source-map-js: 1.2.2

auditConfig:
  ignoreGhsas:
    # node-forge has no patched release yet (latest 1.4.0); only reached via the
    # example gondolin extension, not the coding-agent runtime.
    # TODO: remove once node-forge ships a fix (>1.4.0) and bump gondolin.
    - GHSA-86w9-cpqp-85rv
    # zod <4.6.6 is fixed by the override above for zod 4.x consumers.
    # @anthropic-ai/sandbox-runtime (example extension only) still requires
    # zod ^3, where the 4.x patch does not apply; drop this once it ships a
    # zod 4 release.
    - GHSA-mrhx-c7xc-m3w5

