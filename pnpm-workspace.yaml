packages:
  - 'packages/*'
  - 'packages/session-backends/*'
  - 'packages/coding-agent/examples/extensions/with-deps'
  - 'packages/coding-agent/examples/extensions/custom-provider-anthropic'
  - 'packages/coding-agent/examples/extensions/custom-provider-gitlab-duo'
  - 'packages/coding-agent/examples/extensions/sandbox'
  - 'packages/coding-agent/examples/extensions/gondolin'

linkWorkspacePackages: true
preferWorkspacePackages: true

overrides:
  shell-quote: 1.12.0
  '@modelcontextprotocol/sdk': 1.32.0
  'zod@>=4.0.0 <4.6.6': 4.6.6
  body-parser: 2.4.0
  vite: 8.2.4
  source-map-js: 1.2.2
  hono: 4.13.11
  ip-address: 10.7.4
  fast-uri: 3.1.9
  '@hono/node-server': 2.1.3
  node-forge: 1.4.3

auditConfig:
  ignoreGhsas:
    # zod <4.6.6 is fixed by the override above for zod 4.x consumers.
    # @anthropic-ai/sandbox-runtime (example extension only) still requires
    # zod ^3, where the 4.x patch does not apply; drop this once it ships a
    # zod 4 release.
    - GHSA-mrhx-c7xc-m3w5
    # minimatch <11.0.1 (coding-agent): the vulnerable path needs
    # optimizationLevel >= 2, which is never set; patterns come from local user
    # config. The fix (11.0.1) is still inside the minimum release age window.
    # TODO: remove once minimatch is bumped to >=11.0.1 (on/after 2026-11-04 UTC).
    - GHSA-g3hv-75wg-m249

allowBuilds:
  '@google/genai': set this to true or false
  canvas: set this to true or false
  cpu-features: set this to true or false
  esbuild: set this to true or false
  protobufjs: set this to true or false
  ssh2: set this to true or false
